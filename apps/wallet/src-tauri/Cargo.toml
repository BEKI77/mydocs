[package]
name = "wallet"
version = "0.1.0"
description = "Digital document wallet"
edition = "2021"
rust-version = "1.89"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (required on Windows).
name = "wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.4.0", features = [] }

[dependencies]
tauri = { version = "~2.8.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
